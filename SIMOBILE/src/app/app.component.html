<ion-app>
  <ion-split-pane contentId="main-content">
    <!-- Drawer / Side Menu yang membungkus navigasi Tab -->
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-icon name="storefront-outline" slot="start" class="ion-margin-start"></ion-icon>
          <ion-title>SIMOBILE</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          <ion-item button routerLink="/tabs/dashboard" routerDirection="root" lines="none">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>

          <ion-item
            *ngFor="let menu of menuTambahan"
            button
            [routerLink]="menu.url"
            routerDirection="root"
            lines="none">
            <ion-icon [name]="menu.icon" slot="start"></ion-icon>
            <ion-label>{{ menu.judul }}</ion-label>
          </ion-item>

          <ion-item button (click)="logout()" lines="none">
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Logout</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>

    <!-- Konten utama: berisi ion-tabs (Dashboard/Produk/Transaksi/Profil) -->
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
